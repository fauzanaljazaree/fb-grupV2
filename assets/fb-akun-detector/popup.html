<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        font-family: Arial, sans-serif;
        padding: 12px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 8px 16px;
        background-color: #1877f2;
        color: white;
        border: none;
        border-radius: 6px;

        font-weight: bold;
      }
      button:hover {
        background-color: #166fe5;
      }
      #result {
        margin-top: 12px;
        font-size: 13px;
        color: #333;
        word-break: break-word;
      }

  </head>
  <body>
    <button id="startBtn">Start</button>
    <div id="result"></div>

    <script src="popup.js"></script>

</html>
